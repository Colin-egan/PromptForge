[pytest]
# Pytest configuration for PromptForge backend tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Markers for categorizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for end-to-end workflows
    slow: Tests that take a long time to run
    requires_docker: Tests that require Docker to be running
    requires_watsonx: Tests that require watsonx API credentials

# Coverage options (if pytest-cov is installed)
# addopts = --cov=app --cov-report=html --cov-report=term

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (if pytest-timeout is installed)
# timeout = 300

# Asyncio mode
asyncio_mode = auto

; Made with Bob
